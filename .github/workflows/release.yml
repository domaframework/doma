name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: false

env:
  JDK_DISTRIBUTION: zulu
  JDK_VERSION_OLDEST: 17

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      release_ref: ${{ steps.release-ref.outputs.release_ref }}

    steps:
      - name: Assign input version
        if: inputs.version != ''
        run: echo "RELEASE_VERSION=${{ inputs.version }}" >> $GITHUB_ENV

      - name: Get latest draft release title
        if: inputs.version == ''
        run: |
          TITLE=$(gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.draft==true) | .name' | head -n 1)
          if [[ -z "$TITLE" ]]; then
            echo "No draft release found."
            exit 1
          fi          
          echo "RELEASE_VERSION=$TITLE" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # gradle/gradle-daemon-jvm.properties pins the Gradle daemon to the oldest JDK,
      # the documented development environment, because Spotless on JVM 25+ rejects the
      # pinned google-java-format. The daemon finds it through org.gradle.java.installations.fromEnv.
      - name: Set up the oldest JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: ${{ env.JDK_DISTRIBUTION }}
          java-version: ${{ env.JDK_VERSION_OLDEST }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Prepare git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Release ${{ env.RELEASE_VERSION }}
        run: >
          ./gradlew
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ env.JDK_VERSION_OLDEST }}_X64
          -Prelease.releaseVersion=${{ env.RELEASE_VERSION }}
          --no-configuration-cache
          release

      - name: Assign release ref
        id: release-ref
        run: echo "release_ref=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build
          path: ./**/build/reports

  verify-and-publish:
    name: Verify and Publish
    needs: release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release.outputs.release_ref }}
      publish: true
    secrets: inherit
