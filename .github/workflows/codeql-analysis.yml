name: "Code Scanning"

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  JDK_DISTRIBUTION: zulu
  JDK_VERSION_OLDEST: 17
  JDK_VERSION_LATEST: 27
  JDK_VERSION_LATEST_LTS: 25

jobs:
  CodeQL-Build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: java

      - name: Set up JDKs
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: ${{ env.JDK_DISTRIBUTION }}
          # gradle/gradle-daemon-jvm.properties pins the Gradle daemon to the oldest JDK,
          # found through org.gradle.java.installations.fromEnv. actions/setup-java points
          # JAVA_HOME at the last version listed here, which only runs the gradlew launcher.
          # Keep the oldest JDK last so the launcher also runs on a JDK Gradle supports.
          java-version: |
            ${{ env.JDK_VERSION_LATEST }}
            ${{ env.JDK_VERSION_LATEST_LTS }}
            ${{ env.JDK_VERSION_OLDEST }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build
        run: >
          ./gradlew
          --no-daemon
          --no-build-cache
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ env.JDK_VERSION_OLDEST }}_X64,JAVA_HOME_${{ env.JDK_VERSION_LATEST }}_X64,JAVA_HOME_${{ env.JDK_VERSION_LATEST_LTS }}_X64
          clean assemble check -x :doma-processor:check

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CodeQL-Build
          path: |
            ./**/build/reports
            /home/runner/work/doma/doma/.gradle

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
